name: Deploy to GitHub Pages

on:
  # Automatically triggers on push to the main branch
  push:
    branches: [ main ]

  # Allows manual workflow dispatch from GitHub Actions tab
  workflow_dispatch:

# Minimum permissions required to checkout code and deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent deployment conflicts
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies, build and upload Astro site
        uses: withastro/action@v6

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
